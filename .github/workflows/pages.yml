# Publishes the static report (reports/index.html) to GitHub Pages.
# Only the report is deployed, not the repository. The report is built locally by
# scripts/build_report.py from the committed results; this workflow does not rebuild it.
name: Publish report

on:
  push:
    branches: [main]
    paths: [reports/index.html, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stage the report
        run: |
          mkdir _site
          cp reports/index.html _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
